<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KuralGuard - 15 Application Screenshots Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000a20;
      --card-bg: #0a1733;
      --card-border: #1a2a50;
      --text: #e6ebf5;
      --text-muted: #8c9bb5;
      --primary: #00677d;
      --primary-light: #4ed8f5;
      --accent-red: #ba1a1a;
      --accent-teal: #00677d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 32px 20px 80px;
    }
    .header {
      max-width: 1200px;
      margin: 0 auto 40px;
      text-align: center;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 9999px;
      background: rgba(0, 103, 125, 0.25);
      border: 1px solid rgba(78, 216, 245, 0.4);
      color: var(--primary-light);
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 16px;
    }
    h1 {
      font-size: clamp(28px, 4vw, 42px);
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
      color: #ffffff;
    }
    p.subtitle {
      color: var(--text-muted);
      font-size: 16px;
      max-width: 720px;
      margin: 0 auto;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
      gap: 28px;
      max-width: 1400px;
      margin: 0 auto;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    }
    .card:hover {
      transform: translateY(-4px);
      border-color: var(--primary-light);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
    }
    .img-wrap {
      background: #000;
      position: relative;
      cursor: pointer;
      overflow: hidden;
      aspect-ratio: 16 / 10;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      transition: transform 0.3s ease;
    }
    .card:hover .img-wrap img {
      transform: scale(1.02);
    }
    .card-body {
      padding: 20px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }
    .number-tag {
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--primary-light);
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }
    .card-title {
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 8px;
    }
    .card-desc {
      font-size: 13.5px;
      color: var(--text-muted);
      margin-bottom: 16px;
      flex-grow: 1;
      line-height: 1.5;
    }
    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--card-border);
      padding-top: 14px;
      font-size: 12px;
      color: var(--text-muted);
    }
    .btn-view {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 12.5px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-view:hover {
      background: var(--primary);
    }
    /* Modal */
    #modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.92);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    #modal.open { display: flex; }
    #modal img {
      max-width: 96vw;
      max-height: 92vh;
      border-radius: 8px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.8);
      object-fit: contain;
    }
    #modal-close {
      position: absolute;
      top: 24px;
      right: 28px;
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: none;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #modal-close:hover { background: rgba(255, 255, 255, 0.4); }
  </style>
</head>
<body>

  <header class="header">
    <div class="badge">
      <span class="material-symbols-outlined" style="font-size:16px;">verified</span>
      Google Stitch Civic Design System
    </div>
    <h1>KuralGuard Screen Showcase</h1>
    <p class="subtitle">Complete catalog of 15 high-priority application screens captured live at 2x Retina DPI. Click any image to view full resolution.</p>
  </header>

  <main class="grid" id="gallery"></main>

  <div id="modal" onclick="closeModal()">
    <button id="modal-close" onclick="closeModal()">&times;</button>
    <img id="modal-img" src="" alt="Full view" onclick="event.stopPropagation()">
  </div>

  <script>
    const items = [
      {
        num: "01",
        file: "01_hero_landing_page.png",
        title: "Hero Landing Page & Civic Safety Tagline",
        route: "#/",
        desc: "KuralGuard safety shield emblem, bilingual EN/Tamil switcher pill, the primary civic tagline banner, and prominent action buttons."
      },
      {
        num: "02",
        file: "02_community_safety_pulse_metrics.png",
        title: "Demonstration Impact Metrics & Pulse",
        route: "#/ (Pulse)",
        desc: "3-column bento architecture displaying Total Hazards (12), High Risk Identified (4 in crimson), and Resolved / Safe (6 in deep teal)."
      },
      {
        num: "03",
        file: "03_core_civic_value_pillars.png",
        title: "Three Core Civic Value Pillars",
        route: "#/ (Pillars)",
        desc: "Structured value cards: 1. Understand Risk, 2. Get Safe Guidance, and 3. Support Community Action."
      },
      {
        num: "04",
        file: "04_featured_demo_scenario_callout.png",
        title: "Featured Demo Scenario Callout",
        route: "#/ (Scenario)",
        desc: "High-priority student observation card with pulsing radar ping for Bharathi School crossing hazard and 1-click AI brief trigger."
      },
      {
        num: "05",
        file: "05_report_step1_category_selection.png",
        title: "Report Step 1: Category Selection Grid",
        route: "#/report",
        desc: "3-stage civic progress stepper and interactive category selection chips (Road Safety, Lighting, Flooding, Women's Safety, etc.)."
      },
      {
        num: "06",
        file: "06_report_step1_gps_location_strip.png",
        title: "Report Step 1: GPS Auto-Detect & Mini-Map",
        route: "#/report",
        desc: "High-precision GPS auto-detection, verified geo-location status dot, and interactive geocoded satellite mini-map preview."
      },
      {
        num: "07",
        file: "07_report_step1_description_tags_upload.png",
        title: "Report Step 1: Description, Tags & Upload",
        route: "#/report",
        desc: "Incident observation textarea with character counter, suggested quick-tags (+ Missing Signage, + Blind Turn), urgency toggle, and photo upload."
      },
      {
        num: "08",
        file: "08_report_step1_anonymous_and_language.png",
        title: "Report Step 1: Anonymous Switch & Language",
        route: "#/report",
        desc: "Encrypted anonymous reporting switch card with lock animation, preferred brief language selector (English / தமிழ்), and civic trust seal."
      },
      {
        num: "09",
        file: "09_ai_analysis_hazard_triage.png",
        title: "AI Safety Analysis: Hazard Triage & 94% Confidence",
        route: "#/analysis",
        desc: "Real-time AI model status, detected hazard card (HIGH RISK), animated 94% confidence bar, dual spatial vision lenses, and risk factors."
      },
      {
        num: "10",
        file: "10_ai_analysis_immediate_safety_advice.png",
        title: "AI Analysis: Immediate Guidance & Emergency Dialers",
        route: "#/analysis",
        desc: "Deep navy emergency guidance card with tactical transit steps, 112/108 quick dialers, and on-duty Ward Marshall intercom contact."
      },
      {
        num: "11",
        file: "11_generated_safety_brief_docket.png",
        title: "Generated Safety Brief: Official Civic Docket",
        route: "#/generated-report",
        desc: "Formal municipal affidavit (#KG-2025-0842) with tamper-evident security badge, 450+ daily students demographic impact, and cryptographic seal."
      },
      {
        num: "12",
        file: "12_civic_lifecycle_timeline_and_actions.png",
        title: "Civic Lifecycle Timeline & Export Utilities",
        route: "#/generated-report",
        desc: "4-stage civic escalation tracker (Draft → Submitted → Verified → Resolved) and 4 distribution tools (Copy Text, Download, Share, Print)."
      },
      {
        num: "13",
        file: "13_community_dashboard_kpis_and_search.png",
        title: "Community Dashboard: Live KPIs & Search Filters",
        route: "#/dashboard",
        desc: "Ward 14 SafeZones watch header, 4-card metric bento grid (Total, High-Risk, Resolved, Categories), search bar, and filter chips."
      },
      {
        num: "14",
        file: "14_community_dashboard_radar_map_and_feed.png",
        title: "Dashboard: Ward 14 Patrol & Hazard Radar Map",
        route: "#/dashboard",
        desc: "Live cluster radar map with school hotspot ping, active incident feed cards with severity borders, and Mark Resolved actions."
      },
      {
        num: "15",
        file: "15_safety_and_emergency_resources.png",
        title: "Safety & Emergency Resources Directory",
        route: "#/resources",
        desc: "Resource directory with mandatory demo disclosure notice, fast-tap speed dial pills (112, 181, 108, 1098), Pink Patrol, and Counselor contacts."
      }
    ];

    const gallery = document.getElementById('gallery');
    items.forEach(item => {
      const card = document.createElement('article');
      card.className = 'card';
      card.innerHTML = `
        <div class="img-wrap" onclick="openModal('${item.file}')">
          <img src="${item.file}" alt="${item.title}" loading="lazy">
        </div>
        <div class="card-body">
          <span class="number-tag">Screen ${item.num} • ${item.route}</span>
          <h2 class="card-title">${item.title}</h2>
          <p class="card-desc">${item.desc}</p>
          <div class="card-footer">
            <span><code>${item.file}</code></span>
            <button class="btn-view" onclick="openModal('${item.file}')">
              <span class="material-symbols-outlined" style="font-size:16px;">zoom_in</span> View Full
            </button>
          </div>
        </div>
      `;
      gallery.appendChild(card);
    });

    function openModal(file) {
      document.getElementById('modal-img').src = file;
      document.getElementById('modal').classList.add('open');
    }
    function closeModal() {
      document.getElementById('modal').classList.remove('open');
    }
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });
  </script>
</body>
</html>
